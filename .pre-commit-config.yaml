default_language_version:
  python: python3

default_install_hook_types: [pre-commit, pre-push]

exclude: '^(\.claude/)'

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: detect-private-key

  - repo: local
    hooks:
      - id: forbid-env-secrets
        name: forbid committing .env files (.env.example only)
        entry: Attempted to commit .env file containing potential secrets. Only .env.example files may be committed per spec.md §5.
        language: fail
        files: '(?i)(^|/)\.env(\.(?!example$).*)?$'

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.9.9
    hooks:
      - id: ruff
        name: ruff-lint
        args: [--fix]
      - id: ruff-format
        name: ruff-format

  # Frontend hooks (prettier/eslint) are disabled until frontend/ exists —
  # pre-commit tries to provision their Node environments on every run
  # regardless of whether any files match, which is pure overhead (and a
  # failure point) against an empty directory. Re-enable once frontend/
  # is scaffolded (see spec.md "Stack").
  # - repo: https://github.com/pre-commit/mirrors-prettier
  #   rev: v3.1.0
  #   hooks:
  #     - id: prettier
  #       files: ^frontend/
  #       additional_dependencies:
  #         - prettier@3.2.5
  #
  # - repo: https://github.com/pre-commit/mirrors-eslint
  #   rev: v9.9.1
  #   hooks:
  #     - id: eslint
  #       files: ^frontend/.*\.[jt]sx?$
  #       types: [file]
  #       additional_dependencies:
  #         - eslint@^9.0.0

  - repo: local
    hooks:
      - id: backend-smoke-tests
        name: backend smoke tests (pytest)
        entry: bash -c 'cd backend && uv run pytest -q'
        language: system
        pass_filenames: false
        files: ^backend/
        stages: [pre-push]
      - id: backend-build
        name: backend build (uv build)
        entry: bash -c 'cd backend && uv build'
        language: system
        pass_filenames: false
        files: ^backend/
        stages: [pre-push]
