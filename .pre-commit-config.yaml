default_language_version:
  python: python3

default_install_hook_types: [pre-commit, pre-push]

exclude: '^(\.claude/)'

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
        exclude: '^frontend/tsconfig.*\.json$' # JSONC (comments/trailing commas), not strict JSON
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: detect-private-key

  - repo: local
    hooks:
      - id: forbid-env-secrets
        name: forbid committing .env files (.env.example only)
        entry: Attempted to commit .env file containing potential secrets. Only .env.example files may be committed per spec.md §5.
        language: fail
        files: '(?i)(^|/)\.env(\.(?!example$).*)?$'

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.9.9
    hooks:
      - id: ruff
        name: ruff-lint
        args: [--fix]
      - id: ruff-format
        name: ruff-format

  - repo: local
    hooks:
      - id: frontend-lint
        name: frontend lint (eslint + prettier --check)
        entry: bash -c 'cd frontend && npm run lint'
        language: system
        pass_filenames: false
        files: ^frontend/

  - repo: local
    hooks:
      - id: backend-smoke-tests
        name: backend smoke tests (pytest)
        entry: bash -c 'cd backend && uv run pytest -q'
        language: system
        pass_filenames: false
        files: ^backend/
        stages: [pre-push]
      - id: backend-build
        name: backend build (uv build)
        entry: bash -c 'cd backend && uv build'
        language: system
        pass_filenames: false
        files: ^backend/
      - id: frontend-build
        name: frontend build (tsc + vite build)
        entry: bash -c 'cd frontend && npm run build'
        language: system
        pass_filenames: false
        files: ^frontend/
        stages: [pre-push]
