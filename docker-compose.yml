services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: kpinder
      POSTGRES_PASSWORD: kpinder
      POSTGRES_DB: kpinder
    ports:
      - "${DB_HOST:-127.0.0.2}:${DB_PORT:-5432}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kpinder"]
      interval: 5s
      timeout: 5s
      retries: 5

  db-test:
    image: postgis/postgis:16-3.4
    profiles:
      - test
    environment:
      POSTGRES_USER: kpinder
      POSTGRES_PASSWORD: kpinder
      POSTGRES_DB: kpinder_test
    ports:
      - "${TEST_DB_HOST:-127.0.0.2}:${TEST_DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kpinder -d kpinder_test"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    # Context is the repo root (not ./backend) since Lab 5 — matching-core
    # (ADR-0026) is a local uv path dependency the Dockerfile needs inside
    # its build context. See backend/Dockerfile and the repo-root
    # railway.json.
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - path: .env
        required: false
      - path: backend/.env
        required: false
    environment:
      # Always "db" — the Docker-network service name, resolvable only from
      # inside this compose network. DB_HOST (below, in `ports:`) is a
      # different thing: the *host-side* bind IP for reaching `db` from
      # outside Docker (ADR-0021). Substituting that into this URL too (as
      # `${DB_HOST:-db}` used to) broke the backend's own DB connection
      # whenever DB_HOST was set to anything other than its "db" default —
      # e.g. .env.example's DB_HOST=localhost (meant for bare-metal/Makefile
      # use, not compose) made the backend container try to connect to
      # itself instead of to `db`.
      DATABASE_URL: postgresql+asyncpg://kpinder:kpinder@db:5432/kpinder
    ports:
      - "${APP_HOST:-127.0.0.3}:${APP_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data:
