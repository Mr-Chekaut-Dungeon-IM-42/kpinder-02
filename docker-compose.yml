services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: kpinder
      POSTGRES_PASSWORD: kpinder
      POSTGRES_DB: kpinder
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kpinder"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://kpinder:kpinder@db:5432/kpinder
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data:
