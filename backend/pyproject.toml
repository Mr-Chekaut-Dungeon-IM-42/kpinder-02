[project]
name = "kpinder-backend"
version = "0.1.0"
description = "Kpinder dating service backend"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "pydantic[email]>=2.8.0",
    "pydantic-settings>=2.4.0",
    "uvicorn[standard]>=0.30.0",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",
    "geoalchemy2>=0.15.0",
    "argon2-cffi>=23.1.0",
    "pyjwt>=2.9.0",
    "boto3>=1.35.0",
    "python-multipart>=0.0.12",
]

[dependency-groups]
dev = [
    "httpx>=0.27.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.9.0",
    "testcontainers[postgres]>=4.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests", "app"]
pythonpath = ["."]
asyncio_mode = "auto"
markers = [
    "integration: requires Docker (testcontainers); excluded by default",
    "e2e: black-box journey requiring running server; excluded by default",
]
addopts = "-m 'not integration and not e2e'"

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.File", "fastapi.Query"]

[tool.mutmut]
source_paths = ["app/chat/service.py"]
pytest_add_cli_args_test_selection = ["app/chat/tests/test_service.py"]
also_copy = ["app"]
