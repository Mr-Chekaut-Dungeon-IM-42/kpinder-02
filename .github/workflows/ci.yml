name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Dummy values so `app.shared.config.Settings` (pydantic-settings, required
  # fields) can be constructed at import time. No real secret is needed —
  # nothing in CI talks to a real external service.
  JWT_SECRET: ci-dummy-secret
  DATABASE_URL: postgresql+asyncpg://kpinder:kpinder@localhost:5432/kpinder

jobs:
  pr-title:
    name: Conventional Commits (PR title)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  backend-lint:
    name: Backend lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv sync --all-extras
        working-directory: backend
      - run: uv run ruff check .
        working-directory: backend
      - run: uv run ruff format --check .
        working-directory: backend

  backend-build:
    name: Backend build (uv build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv build
        working-directory: backend

  backend-test-unit:
    name: Backend unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv sync --all-extras
        working-directory: backend
      - run: uv run pytest -q
        working-directory: backend

  backend-test-integration:
    name: Backend integration tests (real Postgres+PostGIS)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: kpinder
          POSTGRES_PASSWORD: kpinder
          POSTGRES_DB: kpinder_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U kpinder"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=5
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv sync --all-extras
        working-directory: backend
      - run: uv run pytest -q -m integration
        working-directory: backend
        env:
          TEST_DB_HOST: localhost
          TEST_DB_PORT: 5432

  backend-test-e2e:
    name: Backend E2E tests (advisory, non-blocking)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - name: Start backend + db via docker compose
        run: |
          cat > .env <<EOF
          JWT_SECRET=ci-dummy-secret
          DB_HOST=127.0.0.1
          DB_PORT=5432
          APP_HOST=127.0.0.1
          APP_PORT=8000
          EOF
          docker compose up -d --build backend
      - name: Wait for backend health
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8000/health > /dev/null; then exit 0; fi
            sleep 2
          done
          echo "backend never became healthy" >&2
          docker compose logs
          exit 1
      - run: uv sync --all-extras
        working-directory: backend
      - run: uv run pytest -q -m e2e
        working-directory: backend
        env:
          E2E_BASE_URL: http://127.0.0.1:8000
      - if: always()
        run: docker compose down -v

  frontend-lint:
    name: Frontend lint (eslint + prettier)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run lint
        working-directory: frontend

  frontend-build:
    name: Frontend build (vite build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
