name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pr-title:
    name: Conventional Commits (PR title)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  backend-lint:
    name: Backend lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv sync --all-extras
        working-directory: backend
      - run: uv run ruff check .
        working-directory: backend
      - run: uv run ruff format --check .
        working-directory: backend

  backend-build:
    name: Backend build (uv build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv build
        working-directory: backend

  backend-test-unit:
    name: Backend unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      # Settings (pydantic-settings) needs JWT_SECRET/DATABASE_URL to construct;
      # .env.example is the one committed source of truth for these (Makefile
      # and docker-compose already read it the same way) instead of
      # duplicating dummy values inline here.
      - run: cp .env.example backend/.env
      - run: uv sync --all-extras
        working-directory: backend
      - run: uv run pytest -q
        working-directory: backend

  backend-test-integration:
    name: Backend integration tests (real Postgres+PostGIS)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: kpinder
          POSTGRES_PASSWORD: kpinder
          # kpinder (not kpinder_test): matches the local `db` service
          # (docker-compose.yml), not `db-test` — conftest.py's
          # ensure_test_database() connects here as admin and creates
          # kpinder_test itself if it doesn't exist yet, same as it does
          # against a developer's local `db` container.
          POSTGRES_DB: kpinder
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U kpinder"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=5
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: cp .env.example backend/.env
      - run: uv sync --all-extras
        working-directory: backend
      # No TEST_DB_HOST/TEST_DB_PORT override needed: conftest.py's own
      # defaults (localhost:5432, see ADR-0021) already match where the
      # `postgres` service above is exposed.
      - run: uv run pytest -q -m integration
        working-directory: backend

  backend-test-e2e:
    name: Backend E2E tests (advisory, non-blocking)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - name: Start backend + db via docker compose
        run: |
          # .env.example is the single source of truth for every value here —
          # no override needed. ADR-0021's DB_HOST/APP_HOST loopback-alias
          # dance (127.0.0.2/127.0.0.3) exists for macOS dev machines, where
          # only 127.0.0.1 is bound by default; GitHub's ubuntu-latest
          # runners are Linux, where the whole 127.0.0.0/8 range is already
          # routed to loopback, so the compose defaults just work.
          #
          # IMPORTANT: don't set DB_HOST here to "fix" that — DATABASE_URL
          # (line below in docker-compose.yml) reads the *same* DB_HOST var
          # for the backend container's own DB connection string, where it
          # must stay "db" (the Docker-network service name). Overriding
          # DB_HOST for the host-side port bind breaks that connection
          # instead (confirmed locally: alembic/signup failed with
          # "Connect call failed 127.0.0.1:5432" from inside the container).
          cp .env.example .env
          cp .env.example backend/.env
          docker compose up -d --build backend
      - name: Wait for backend health
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.3:8000/health > /dev/null; then exit 0; fi
            sleep 2
          done
          echo "backend never became healthy" >&2
          docker compose logs
          exit 1
      - name: Apply migrations
        # `/health` doesn't touch the DB, so the container reports healthy
        # on an empty schema — the e2e journey (signup, etc.) needs the
        # tables to actually exist first.
        run: docker compose exec -T backend uv run alembic upgrade head
      - run: uv sync --all-extras
        working-directory: backend
      - run: uv run pytest -q -m e2e
        working-directory: backend
        env:
          E2E_BASE_URL: http://127.0.0.3:8000
      - if: always()
        run: docker compose down -v

  frontend-lint:
    name: Frontend lint (eslint + prettier)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run lint
        working-directory: frontend

  frontend-build:
    name: Frontend build (vite build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
